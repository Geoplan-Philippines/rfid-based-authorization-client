<header class="app-header px-4 border-b border-border bg-background">
  <nav class="h-16 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <p-button
        icon="pi pi-bars"
        [text]="true"
        severity="secondary"
        class="lg:hidden"
        (onClick)="toggleSidebar()"
        [ariaLabel]="sidebarOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        aria-controls="mobile-sidebar"
        [attr.aria-expanded]="sidebarOpen()"
      />
      <div class="brand-lockup" aria-label="Eagle Cement Gate Authorization">
        <img
          ngSrc="/assets/eagle-cement-logo.png"
          width="810"
          height="430"
          priority
          alt="Eagle Cement"
          class="brand-logo"
        />
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="product-name">Gate Authorization</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <p-button icon="pi pi-bell" [text]="true" severity="secondary" ariaLabel="Notifications" />
      <p-button icon="pi pi-cog" [text]="true" severity="secondary" ariaLabel="Settings" />

      <div class="flex items-center gap-2 ml-2">
        <p-avatar
          [label]="initials()"
          shape="square"
          [style]="{ background: 'var(--p-primary-100)', color: 'var(--p-primary-800)', fontWeight: '600' }"
          [attr.aria-label]="'User profile for ' + displayName()"
        />
        <span class="text-sm font-medium hidden sm:block">
          {{ displayName() }}
        </span>
      </div>

      <p-button
        icon="pi pi-sign-out"
        [text]="true"
        severity="secondary"
        (onClick)="logout()"
        ariaLabel="Sign out"
      />
    </div>
  </nav>
</header>
