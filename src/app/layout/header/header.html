<header class="px-4 border-b border-border bg-background">
  <nav class="h-16 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <p-button
        icon="pi pi-bars"
        [text]="true"
        severity="secondary"
        class="md:hidden"
        (onClick)="toggleSidebar()"
        aria-label="Toggle sidebar"
      />
      <span class="text-xl font-bold tracking-tight text-heading">RFID-based Authorization</span>
    </div>

    <div class="flex items-center gap-2">
      <p-button icon="pi pi-bell" [text]="true" severity="secondary" aria-label="Notifications" />
      <p-button icon="pi pi-cog" [text]="true" severity="secondary" aria-label="Settings" />

      <div class="flex items-center gap-2 ml-2">
        <p-avatar
          [label]="initials()"
          shape="square"
          [style]="{ background: 'var(--p-primary-100)', color: 'var(--p-primary-800)', fontWeight: '600' }"
          [attr.aria-label]="'User profile for ' + displayName()"
        />
        <span class="text-sm font-medium hidden sm:block">
          {{ displayName() }}
        </span>
      </div>

      <p-button
        icon="pi pi-sign-out"
        [text]="true"
        severity="secondary"
        (onClick)="logout()"
        aria-label="Sign out"
      />
    </div>
  </nav>
</header>
