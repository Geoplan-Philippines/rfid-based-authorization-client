<ng-template #navigation>
  <nav class="flex flex-col gap-7 py-5">
    @for (section of navSections(); track section.title) {
      <div>
        <h3 class="mb-2 px-5 text-[11px] font-semibold tracking-[0.12em] uppercase text-body/60">
          {{ section.title }}
        </h3>
        <ul class="flex flex-col">
          @for (item of section.items; track item.route) {
            <li>
              @if (item.comingSoon) {
                <span
                  [class]="itemBase + ' ' + itemDisabled"
                  aria-disabled="true"
                >
                  <i class="pi {{ item.icon }} text-base w-4 text-center" aria-hidden="true"></i>
                  <span class="truncate">{{ item.label }}</span>
                  <span class="ml-auto shrink-0 rounded-full bg-foreground/10 px-2 py-0.5 text-[11px] font-medium uppercase tracking-wide text-body/60">
                    Soon
                  </span>
                </span>
              } @else {
                <a
                  [routerLink]="item.route"
                  routerLinkActive
                  #rla="routerLinkActive"
                  [class]="itemBase + ' ' + (rla.isActive ? itemActive : itemInactive)"
                  [attr.aria-current]="rla.isActive ? 'page' : null"
                  (click)="layoutService.closeSidebar()"
                >
                  <i class="pi {{ item.icon }} text-base w-4 text-center" aria-hidden="true"></i>
                  <span class="truncate">{{ item.label }}</span>
                </a>
              }
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</ng-template>

@if (layoutService.sidebarOpen()) {
  <div
    data-testid="sidebar-backdrop"
    class="fixed inset-x-0 top-16 bottom-0 z-30 bg-foreground/20 transition-opacity lg:hidden"
    (click)="layoutService.closeSidebar()"
    aria-hidden="true"
  ></div>
}

<aside
  id="mobile-sidebar"
  class="fixed top-16 bottom-0 left-0 z-40 w-64 max-w-[calc(100vw-3rem)] transform overflow-y-auto overscroll-contain border-r border-border bg-background transition-transform duration-200 ease-in-out lg:hidden"
  aria-label="Primary navigation"
  [attr.aria-hidden]="!layoutService.sidebarOpen()"
  [attr.inert]="layoutService.sidebarOpen() ? null : ''"
  [class.-translate-x-full]="!layoutService.sidebarOpen()"
  [class.translate-x-0]="layoutService.sidebarOpen()"
  (keydown.escape)="layoutService.closeSidebar()"
>
  <ng-container [ngTemplateOutlet]="navigation" />
</aside>

<aside
  class="hidden h-full w-64 shrink-0 overflow-y-auto border-r border-border bg-background lg:block"
  aria-label="Primary navigation"
>
  <ng-container [ngTemplateOutlet]="navigation" />
</aside>
