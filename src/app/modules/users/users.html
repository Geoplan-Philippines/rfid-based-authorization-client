<main class="flex flex-col w-full p-6 overflow-auto">
  <div class="mb-6">
    <h1 class="text-2xl font-bold" style="color: var(--text-heading)">Users</h1>
    <p class="text-sm text-body/60 mt-1">System users and their access roles.</p>
  </div>

  @if (error()) {
    <div class="mb-4 flex items-center gap-2 p-4 rounded-sm border border-destructive/30 bg-muted-destructive text-destructive text-sm" role="alert">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span>{{ error() }}</span>
    </div>
  }

  @if (loading()) {
    <div class="flex justify-center py-14">
      <p-progressSpinner [style]="{ width: '42px', height: '42px' }" aria-label="Loading users" />
    </div>
  } @else {
    <p-table [value]="users()" styleClass="w-full">
      <ng-template #header>
        <tr>
          <th scope="col" class="bg-primary! text-primary-foreground!">Name</th>
          <th scope="col" class="bg-primary! text-primary-foreground!">Email</th>
          <th scope="col" class="bg-primary! text-primary-foreground!">Role</th>
        </tr>
      </ng-template>

      <ng-template #body let-user>
        <tr>
          <td>
            <div class="flex items-center gap-3">
              <p-avatar
                [label]="initials(user)"
                shape="square"
                [style]="{ background: 'var(--p-primary-100)', color: 'var(--p-primary-800)', fontWeight: '600' }"
              />
              <span class="font-medium">{{ user.firstName }} {{ user.lastName }}</span>
            </div>
          </td>
          <td>{{ user.email }}</td>
          <td>
            <p-tag [value]="user.role" [severity]="roleSeverity(user.role)" />
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="3">
            <div class="flex flex-col items-center justify-center py-14" style="color: var(--p-primary-200)">
              <i class="pi pi-users text-4xl mb-3" aria-hidden="true"></i>
              <p class="text-sm">No users found.</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</main>
