<div class="flex flex-col flex-1 h-full w-full p-6 overflow-y-auto bg-slate-50 text-slate-900">

  <!-- Main Content Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 min-h-[500px]">
    
    <!-- Left 2 Cols: Main WebRTC Stream Player -->
    <div class="lg:col-span-2 relative bg-slate-950 rounded-2xl overflow-hidden shadow-xl border border-slate-800 flex flex-col justify-center items-center group">
      
      <!-- Video Element -->
      <video
        #videoElement
        autoplay
        playsinline
        [muted]="isMuted()"
        class="w-full h-full object-cover bg-black">
      </video>



      <!-- Bottom Controls Bar -->
      <div class="absolute bottom-4 right-4 flex items-center gap-2 bg-black/70 backdrop-blur-md p-1.5 rounded-lg border border-white/10 z-10">
        <button 
          type="button" 
          (click)="toggleMute()" 
          class="p-2 text-slate-300 hover:text-white hover:bg-white/10 rounded-md transition-colors"
          [title]="isMuted() ? 'Unmute' : 'Mute'">
          <i [class]="isMuted() ? 'pi pi-volume-off' : 'pi pi-volume-up'"></i>
        </button>
        <button 
          type="button" 
          (click)="retry()" 
          class="p-2 text-slate-300 hover:text-white hover:bg-white/10 rounded-md transition-colors"
          title="Reconnect Stream">
          <i class="pi pi-refresh"></i>
        </button>
        <button 
          type="button" 
          (click)="toggleFullscreen()" 
          class="p-2 text-slate-300 hover:text-white hover:bg-white/10 rounded-md transition-colors"
          title="Fullscreen">
          <i class="pi pi-window-maximize"></i>
        </button>
      </div>

      <!-- Loading State -->
      @if (connectionState() === 'connecting') {
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3 z-20">
          <i class="pi pi-spin pi-spinner text-emerald-400 text-4xl"></i>
          <p class="text-sm text-slate-300 font-medium">Connecting to Dome PTZ Camera...</p>
        </div>
      }

      <!-- Error State -->
      @if (error()) {
        <div class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center gap-3 p-6 text-center z-25">
          <i class="pi pi-exclamation-triangle text-amber-400 text-3xl"></i>
          <h3 class="text-sm font-semibold text-white">Stream Error</h3>
          <p class="text-xs text-slate-400 max-w-sm">{{ error() }}</p>
          <button 
            type="button" 
            (click)="retry()" 
            class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow transition-colors">
            Retry Connection
          </button>
        </div>
      }
    </div>

    <!-- Right 1 Col: PTZ Controls & Camera Presets -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col space-y-6">
      
      <!-- PTZ Presets Section -->
      <div class="space-y-3">
        <div class="pb-2 border-b border-slate-100">
          <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
            <i class="pi pi-compass text-emerald-600"></i>
            PTZ Position Presets
          </h2>
          <p class="text-xs text-slate-500">Preset camera vantage points</p>
        </div>

        <div class="space-y-2">
          @for (preset of presets; track preset.id) {
            <button 
              type="button"
              (click)="selectPreset(preset.id)"
              [class.bg-emerald-50]="activePreset() === preset.id"
              [class.border-emerald-300]="activePreset() === preset.id"
              [class.text-emerald-900]="activePreset() === preset.id"
              class="w-full text-left p-3 rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-slate-100 transition-all flex items-center justify-between group">
              <div>
                <h3 class="text-xs font-bold">{{ preset.name }}</h3>
                <p class="text-[11px] text-slate-500 mt-0.5">{{ preset.description }}</p>
              </div>
              <i 
                [class.text-emerald-600]="activePreset() === preset.id"
                [class.text-slate-300]="activePreset() !== preset.id"
                class="pi pi-check-circle text-base"></i>
            </button>
          }
        </div>
      </div>

      <!-- PTZ D-Pad Controls Widget -->
      <div class="space-y-3 pt-2 border-t border-slate-100">
        <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider text-slate-500">Pan / Tilt / Zoom Controls</h3>
        
        <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-4">
          
          <!-- Directional Pad -->
          <div class="grid grid-cols-3 gap-2 w-36 h-36">
            <div></div>
            <button type="button" class="p-2.5 bg-white border border-slate-300 hover:bg-emerald-600 hover:text-white rounded-xl shadow-sm text-slate-700 transition-all flex items-center justify-center">
              <i class="pi pi-chevron-up"></i>
            </button>
            <div></div>

            <button type="button" class="p-2.5 bg-white border border-slate-300 hover:bg-emerald-600 hover:text-white rounded-xl shadow-sm text-slate-700 transition-all flex items-center justify-center">
              <i class="pi pi-chevron-left"></i>
            </button>
            <button type="button" class="p-2.5 bg-emerald-600 text-white rounded-xl shadow-md flex items-center justify-center font-bold text-xs">
              <i class="pi pi-home"></i>
            </button>
            <button type="button" class="p-2.5 bg-white border border-slate-300 hover:bg-emerald-600 hover:text-white rounded-xl shadow-sm text-slate-700 transition-all flex items-center justify-center">
              <i class="pi pi-chevron-right"></i>
            </button>

            <div></div>
            <button type="button" class="p-2.5 bg-white border border-slate-300 hover:bg-emerald-600 hover:text-white rounded-xl shadow-sm text-slate-700 transition-all flex items-center justify-center">
              <i class="pi pi-chevron-down"></i>
            </button>
            <div></div>
          </div>

          <!-- Zoom In / Zoom Out Controls -->
          <div class="flex items-center gap-3 w-full">
            <button type="button" class="flex-1 py-2 px-3 bg-white border border-slate-300 hover:bg-slate-100 rounded-lg text-xs font-semibold text-slate-700 shadow-sm flex items-center justify-center gap-1.5 transition-all">
              <i class="pi pi-search-minus"></i>
              Zoom -
            </button>
            <button type="button" class="flex-1 py-2 px-3 bg-white border border-slate-300 hover:bg-slate-100 rounded-lg text-xs font-semibold text-slate-700 shadow-sm flex items-center justify-center gap-1.5 transition-all">
              <i class="pi pi-search-plus"></i>
              Zoom +
            </button>
          </div>

        </div>
      </div>

    </div>

  </div>

</div>
